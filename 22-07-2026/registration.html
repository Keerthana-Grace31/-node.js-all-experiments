<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: azure;">
    <center>
        <h1>REGISTRATION FORM</h1>
        <div>
            <form action="registration.html" method="post">
                <label for="Fullname">Full Name:</label>
                <input type="text" id="Fullname" name="Fullname" required><br></br>
                <label for="Password">Password:</label>
                <input type="Password" id="Password" name="Password" requried><br></br>
                <label for="Email">Email:</label>
                <input type="email" id="Email" name="Email" requried><br></br>
                <label for="Phone">Phone:</label>
                <input type="tel" id ="Phone" name="Phone" requried><br></br>
                <label for="Age">Age:</label>
                <input type="number" id="Age" name="Age" requried><br></br>
                <label for="DOB">Date of Birth:</label>
                <input type="date" id="DOB" name="DOB" requried><br></br>
                <label for="Gender">Gender: Male</label>
                <input type="radio" id="Gender" name="Gender">
                <label for="Gender">Female</label>
                <input type="radio" id="Gender" name="Gender"><br></br>
                <label for="Address">Address:</label>
                <input type="textarea" id="Address" name="Address" required><br></br>
                <label for="Favouritecolor">Favourite Color:</label>
                <input type="color" id="Favouritecolor" name="Favouritecolor" required><br></br>
                <label for="Website">Website:</label>
                <input type="url" id="Website" name="Website" required><br></br>
                <label for="Country">Country:</label>
                <select>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                </select><br></br>
                <label for="CheckBox">CheckBox</label>
                <input type="checkbox" id="CheckBox" required><br></br>
                <label for="Search">Search:</label>
                <input type="search" id="Search" name="Search" required><br></br>
                <label for="Uploadphoto">Upload Photo:</label>
                <input type="file" id="Uploadphoto" name="uploadphoto" required><br></br>
                <label for="Registrationtime">Registration Time:</label>
                <input type="time" id="Registrationtime" name="Registrationtime" required><br></br>
                <label for="Month">Month:</label>
                <input type="month" id="Month" name="Month" required><br></br>
                <label for="Week">Week:</label>
                <input type="week" id="Week" name="Week" required><br></br>
                <label for="Range">Range:</label>
                <input type="range" id="Range" name="Range" required><br></br>
                <label for="Hidden">Hidden:</label>
                <input type="hidden" id="Hidden" name="Hidden" required><br></br>
                <input type="submit" value="Register">
            </form>
        </div>

    </center>

</body>
</html>
